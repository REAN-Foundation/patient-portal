# This workflow will trigger pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler

name: Dev-CI-CD

# Controls when the workflow will run
on:
  # Allows manual trigger from Actions tab for any selected branch
  workflow_dispatch:

jobs:
  Build-and-Deploy-ArgoCD:
    environment: dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Declare some variables
        id: vars
        shell: bash
        run: |
          echo "branch=$(echo ${GITHUB_REF#refs/heads/} | sed 's#/#-#g')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "repo_name=$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image_repository=${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/$(echo \"$GITHUB_REPOSITORY\" | awk -F / '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "dev_tag=develop_$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Print Branch Details
        run: |
          echo "Branch: ${{ steps.vars.outputs.branch }}"
          echo "Sha: ${{ steps.vars.outputs.sha_short }}"
          echo "Repo: ${{ steps.vars.outputs.repo_name }}"
          echo "Image Repository: ${{ steps.vars.outputs.image_repository }}"
          echo "Dev Tag: ${{ steps.vars.outputs.dev_tag }}"


      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Build and push image to Harbor
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ steps.vars.outputs.image_repository }}:${{ steps.vars.outputs.dev_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

      - name: Install Argo CD CLI
        shell: bash
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd

      - name: Login to Argo CD
        shell: bash
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure

      - name: Update Argo CD app image values (Helm)
        shell: bash
        run: |
          argocd app set ${{ secrets.ARGOCD_APP_NAME }} \
            -p image.repository=${{ steps.vars.outputs.image_repository }} \
            -p image.tag=${{ steps.vars.outputs.dev_tag }}

      - name: Sync Argo CD application
        shell: bash
        run: |
          argocd app sync ${{ secrets.ARGOCD_APP_NAME }}
          argocd app wait ${{ secrets.ARGOCD_APP_NAME }} --health --sync --timeout 600
