name: Dev-CI-CD

# Controls when the workflow will run
on:
  # Allows manual trigger from Actions tab for any selected branch
  workflow_dispatch:

concurrency:
  group: patient-portal-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build-and-Push:
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.vars.outputs.image_repository }}
      develop_tag: ${{ steps.vars.outputs.develop_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Declare some variables
        id: vars
        shell: bash
        run: |
          repo_name=$(echo "$GITHUB_REPOSITORY" | awk -F / '{print $2}')
          owner_lc=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "branch=$(echo ${GITHUB_REF#refs/heads/} | sed 's#/#-#g')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "repo_name=$repo_name" >> "$GITHUB_OUTPUT"
          echo "image_repository=ghcr.io/$owner_lc/$repo_name" >> "$GITHUB_OUTPUT"
          echo "develop_tag=develop_$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Print build details
        run: |
          printf 'Image Repository: %s\n' "${{ steps.vars.outputs.image_repository }}"
          printf 'Develop Tag: %s\n' "${{ steps.vars.outputs.develop_tag }}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create .env from S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp s3://${{ secrets.ENV_FILE_BUCKET_PATH }}/.env ./.env

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.vars.outputs.image_repository }}:${{ steps.vars.outputs.develop_tag }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ steps.vars.outputs.image_repository }}:${{ steps.vars.outputs.develop_tag }},push=true,compression=gzip,compression-level=6,force-compression=true

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  Deploy-ArgoCD:
    # argocd server is only reachable inside the on-prem network (NodePort),
    # so the deploy step runs on the on-prem runner. No image data flows here.
    environment: dev
    needs: Build-and-Push
    runs-on: [self-hosted, onprem-harbor]

    steps:
      - name: Ensure local tools on PATH (self-hosted runner)
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Argo CD CLI
        shell: bash
        run: |
          if ! command -v argocd >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            curl -sSL -o "$HOME/.local/bin/argocd" https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
            chmod +x "$HOME/.local/bin/argocd"
          fi
          argocd version --client --short

      - name: Login to Argo CD
        shell: bash
        run: |
          # argocd CLI expects host:port without scheme or path
          server=$(printf '%s' '${{ secrets.ARGOCD_SERVER }}' | tr -d '\r' | sed -E 's#^[[:space:]]+##; s#[[:space:]]+$##; s#^https?://##; s#/.*$##')
          login() { argocd login "$server" \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --grpc-web --insecure "$@"; }
          # server may terminate TLS or speak plain HTTP (NodePort) — try both
          login || login --plaintext

      - name: Update Argo CD app image values (Helm)
        shell: bash
        run: |
          argocd app set ${{ secrets.ARGOCD_APP_NAME }} \
            -p image.repository=${{ needs.Build-and-Push.outputs.image_repository }} \
            -p image.tag=${{ needs.Build-and-Push.outputs.develop_tag }}

      - name: Sync Argo CD application
        shell: bash
        run: |
          # app has auto-sync: an explicit sync can collide with the in-flight
          # auto-sync ("another operation is already in progress") — tolerate it
          argocd app sync ${{ secrets.ARGOCD_APP_NAME }} --async \
            || echo "sync already running (auto-sync) — waiting for it instead"
          argocd app wait ${{ secrets.ARGOCD_APP_NAME }} --health --sync --timeout 600
